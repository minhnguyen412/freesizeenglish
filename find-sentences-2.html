<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Search - Find Questions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .search-section {
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        .filter-section {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 15px;
            background: #f0f0f0;
            color: #333;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        #resultsInfo {
            display: none;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #666;
        }

        .results-list {
            display: grid;
            gap: 20px;
        }

        .result-item {
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s;
        }

        .result-item:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .quiz-source {
            display: inline-block;
            padding: 4px 8px;
            background: #667eea;
            color: white;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 10px;
        }

        .quiz-source.b-quiz {
            background: #764ba2;
        }

        .question-id {
            color: #999;
            font-size: 14px;
        }

        .full-sentence {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 6px;
            line-height: 1.8;
            color: #2e7d32;
            font-size: 15px;
        }

        .no-results {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 18px;
        }

        .highlight {
            background: yellow;
            padding: 2px 4px;
            border-radius: 2px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .search-box {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .filter-section {
                flex-direction: column;
            }

            .filter-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Quiz Search</h1>
        <p style="text-align: center; color: #999; margin-bottom: 20px;">Search by question, Vietnamese, or English keywords</p>

        <div class="search-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Enter keyword (Tiếng Việt or English)..."
                    autocomplete="off"
                >
                <button onclick="performSearch()">Search</button>
                <button onclick="clearSearch()" style="background: #999;">Clear</button>
            </div>

            <div class="filter-section">
                <button class="filter-btn active" onclick="filterByQuiz('all')">All</button>
                <button class="filter-btn" onclick="filterByQuiz('S-quiz-1')">S-quiz-1</button>
                <button class="filter-btn" onclick="filterByQuiz('B-quiz')">B-quiz</button>
            </div>
        </div>

        <div id="resultsInfo"></div>
        <div id="resultsList" class="results-list"></div>
    </div>

    <script>
        let allData = [];
        let currentResults = [];
        let currentFilter = 'all';

        // Translations (kept for reference but not used in search)
        const vietnameseToEnglish = {
            'ngày': 'day',
            'cuối cùng': 'final',
            'năm': 'year',
            'lớp': 'class',
            'tôi': 'i',
            'bị': 'was',
            'cây': 'tree',
            'gậy': 'stick',
            'bóng chày': 'baseball',
            'đánh': 'hit',
            'mặt': 'face',
            'vào': 'on',
            'cái': 'a',
            'trong': 'in',
            'học': 'school',
            'trung học': 'high school',
            'năm hai': 'sophomore',
            'lớp hai': 'sophomore',
            'với': 'with',
            'của': 'of',
            'cơ': 'or',
            'và': 'and',
            'là': 'is',
            'được': 'be',
            'có': 'have',
            'này': 'this',
            'khi': 'when',
            'nơi': 'place',
            'điều': 'thing',
            'sự': 'a'
        };

        // Normalize Vietnamese text (remove diacritics for better matching)
        function normalizeVietnamese(text) {
            const map = {
                'à|á|ả|ã|ạ|ă|ằ|ắ|ẳ|ẵ|ặ|â|ầ|ấ|ẩ|ẫ|ậ': 'a',
                'đ': 'd',
                'è|é|ẻ|ẽ|ẹ|ê|ề|ế|ể|ễ|ệ': 'e',
                'ì|í|ỉ|ĩ|ị': 'i',
                'ò|ó|ỏ|õ|ọ|ô|ồ|ố|ổ|ỗ|ộ|ơ|ờ|ớ|ở|ỡ|ợ': 'o',
                'ù|ú|ủ|ũ|ụ|ư|ừ|ứ|ử|ữ|ự': 'u',
                'ỳ|ý|ỷ|ỹ|ỵ': 'y',
                'ç': 'c'
            };
            
            let result = text.toLowerCase();
            Object.keys(map).forEach(key => {
                result = result.replace(new RegExp(key, 'g'), map[key]);
            });
            return result;
        }

        // Get English translations for Vietnamese keywords
        function getEnglishTranslations(vietnameseTerm) {
            const normalized = normalizeVietnamese(vietnameseTerm);
            const translations = [];
            
            Object.keys(vietnameseToEnglish).forEach(vn => {
                if (normalizeVietnamese(vn).includes(normalized) || 
                    normalized.includes(normalizeVietnamese(vn))) {
                    translations.push(vietnameseToEnglish[vn]);
                }
            });
            
            return translations;
        }

        async function loadData() {
            try {
                console.log('Loading data...');
                
                // Load S-quiz-1.json
                const response1 = await fetch('data/S-quiz-1.json');
                const data1 = await response1.json();
                
                // Load B-quiz.json
                const response2 = await fetch('data/B-quiz.json');
                const data2 = await response2.json();

                // Combine data with quiz source info
                allData = [
                    ...data1.questions.map(q => ({ ...q, quizSource: 'S-quiz-1' })),
                    ...data2.questions.map(q => ({ ...q, quizSource: 'B-quiz' }))
                ];

                console.log('Data loaded successfully:', allData.length, 'questions');
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('resultsList').innerHTML = 
                    '<div class="no-results">❌ Error loading data. Please check JSON files.</div>';
            }
        }

        function performSearch() {
            const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
            
            if (!searchTerm) {
                document.getElementById('resultsList').innerHTML = 
                    '<div class="no-results">Please enter a keyword to search (Vietnamese or English)</div>';
                document.getElementById('resultsInfo').style.display = 'none';
                return;
            }

            // Reject very short searches
            if (searchTerm.length < 2) {
                document.getElementById('resultsList').innerHTML = 
                    '<div class="no-results">Please enter at least 2 characters</div>';
                document.getElementById('resultsInfo').style.display = 'none';
                return;
            }

            currentResults = allData.filter(question => {
                let matched = false;

                // Check in answers - EXACT match only
                for (let blank of question.blanks) {
                    const answerLower = blank.answer.toLowerCase();
                    if (answerLower.includes(searchTerm)) {
                        matched = true;
                        break;
                    }
                }

                // Check in sentence - EXACT match only (case-insensitive)
                if (!matched) {
                    const sentenceLower = question.sentence.toLowerCase();
                    if (sentenceLower.includes(searchTerm)) {
                        matched = true;
                    }
                }

                // Filter by quiz source
                const filterMatch = currentFilter === 'all' || question.quizSource === currentFilter;

                return matched && filterMatch;
            });

            displayResults();
        }

        function displayResults() {
            const resultsList = document.getElementById('resultsList');
            const resultsInfo = document.getElementById('resultsInfo');

            if (currentResults.length === 0) {
                resultsList.innerHTML = '<div class="no-results">No matching results found</div>';
                resultsInfo.style.display = 'none';
                return;
            }

            resultsInfo.textContent = `Found ${currentResults.length} result${currentResults.length !== 1 ? 's' : ''}`;
            resultsInfo.style.display = 'block';

            resultsList.innerHTML = currentResults.map((question, index) => `
                <div class="result-item">
                    <div class="item-header">
                        <div>
                            <span class="quiz-source ${question.quizSource === 'B-quiz' ? 'b-quiz' : ''}">
                                ${question.quizSource}
                            </span>
                            <span class="question-id">Question #${question.id}</span>
                        </div>
                    </div>
                    <div class="full-sentence">
                        ✅ ${getFullSentence(question)}
                    </div>
                </div>
            `).join('');
        }

        function getFullSentence(question) {
            let result = question.sentence;
            
            // Replace both "___ " and "___" (with or without space)
            let blankIndex = 0;
            
            // First replace all "___ " (with space)
            result = result.replace(/___ /g, () => {
                if (blankIndex < question.blanks.length) {
                    const answer = question.blanks[blankIndex].answer;
                    blankIndex++;
                    return `<strong style="color: #2e7d32; background: #c8e6c9; padding: 2px 4px; border-radius: 2px;">${escapeHtml(answer)}</strong> `;
                }
                return '___ ';
            });
            
            // Then replace remaining "___" (without space) at end or in middle
            result = result.replace(/___/g, () => {
                if (blankIndex < question.blanks.length) {
                    const answer = question.blanks[blankIndex].answer;
                    blankIndex++;
                    return `<strong style="color: #2e7d32; background: #c8e6c9; padding: 2px 4px; border-radius: 2px;">${escapeHtml(answer)}</strong>`;
                }
                return '___';
            });
            
            return result.replace(/<br>/g, '<br>');
        }

        function filterByQuiz(quiz) {
            currentFilter = quiz;
            
            // Update button styles
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Re-perform search with new filter
            performSearch();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('resultsList').innerHTML = '';
            document.getElementById('resultsInfo').style.display = 'none';
            currentResults = [];
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Allow Enter key to search
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        // Load data on page load
        window.addEventListener('load', () => {
            loadData();
        });

        // Set initial message
        window.addEventListener('load', () => {
            const resultsList = document.getElementById('resultsList');
            resultsList.innerHTML = '<div class="no-results">Enter a keyword to search (Vietnamese or English)</div>';
        });
    </script>
</body>
</html>
