<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Find Sentences - English Learning</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #2c3e50;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease-out;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #1a5490;
            letter-spacing: -1px;
        }

        .header p {
            font-size: 1rem;
            color: #64748b;
            font-weight: 400;
        }

        .search-box {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            animation: slideUp 0.6s ease-out 0.1s both;
        }

        .search-input-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-input-wrapper input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e7ff;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .search-input-wrapper input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .search-input-wrapper input::placeholder {
            color: #cbd5e1;
        }

        .search-button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .search-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }

        .search-button:active {
            transform: translateY(0);
        }

        .search-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .option-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .option-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            color: #475569;
        }

        .option-group input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #64748b;
            animation: slideUp 0.6s ease-out 0.2s both;
        }

        .results-count {
            font-weight: 600;
            color: #1a5490;
        }

        .clear-button {
            padding: 8px 16px;
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .clear-button:hover {
            background: #e2e8f0;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: slideUp 0.6s ease-out 0.3s both;
        }

        .sentence-item {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border-left: 4px solid #3b82f6;
            transition: all 0.3s ease;
            animation: slideUp 0.4s ease-out;
        }

        .sentence-item:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            transform: translateY(-2px);
        }

        .sentence-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            align-items: flex-start;
        }

        .audio-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }

        .audio-btn:hover {
            transform: scale(1.2);
        }

        .toggle-description {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .toggle-description:hover {
            transform: scale(1.15);
        }

        .sentence-item h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a202c;
            line-height: 1.6;
            word-spacing: 0.05em;
            margin-bottom: 12px;
        }

        .sentence-item h2 span {
            transition: all 0.2s ease;
        }

        .sentence-item h2 span.highlight {
            background: linear-gradient(120deg, #fef3c7 0%, #fde68a 100%);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
        }

        .sentence-item h2 span.highlight:hover {
            background: linear-gradient(120deg, #fcd34d 0%, #fbbf24 100%);
            box-shadow: 0 2px 8px rgba(251, 191, 36, 0.3);
        }

        .description {
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            color: #475569;
            line-height: 1.6;
            margin-top: 12px;
            border-left: 3px solid #e2e8f0;
        }

        .sentence-id {
            display: inline-block;
            background: #e0e7ff;
            color: #1a5490;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .no-results svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .no-results h3 {
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: #64748b;
        }

        .no-results p {
            font-size: 0.95rem;
        }

        /* Animations */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .search-input-wrapper {
                flex-direction: column;
            }

            .search-button {
                width: 100%;
            }

            .search-options {
                flex-direction: column;
                align-items: flex-start;
            }

            .results-info {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .sentence-item {
                padding: 15px;
            }

            .sentence-item h2 {
                font-size: 1rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }

        /* Modal for word details */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .word-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            animation: slideUp 0.3s ease-out;
        }

        .word-card-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }

        .word-card-close:hover {
            color: #1a202c;
        }

        .word-card h3 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .word-card .pinyin {
            font-size: 1rem;
            color: #666;
            margin-bottom: 16px;
            font-style: italic;
        }

        .word-card .meaning {
            font-size: 0.95rem;
            color: #475569;
            line-height: 1.8;
            margin-bottom: 12px;
        }

        .word-card .image-container {
            margin-top: 16px;
            text-align: center;
        }

        .word-card img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            max-height: 250px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Find Sentences</h1>
            <p>Search through English learning materials</p>
        </div>

        <div class="search-box">
            <div class="search-input-wrapper">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search by word or phrase (English or Vietnamese)..."
                    autocomplete="off"
                >
                <button class="search-button" onclick="performSearch()">Search</button>
            </div>

            <div class="search-options">
                <div class="option-group">
                    <label>
                        <input type="checkbox" id="searchTitle" checked>
                        Search Title
                    </label>
                </div>
                <div class="option-group">
                    <label>
                        <input type="checkbox" id="searchDescription" checked>
                        Search Description
                    </label>
                </div>
                <div class="option-group">
                    <label>
                        <input type="checkbox" id="caseSensitive">
                        Case Sensitive
                    </label>
                </div>
            </div>
        </div>

        <div class="results-info" id="resultsInfo" style="display: none;">
            <span class="results-count">Found <span id="resultCount">0</span> result(s)</span>
            <button class="clear-button" onclick="clearSearch()">Clear Results</button>
        </div>

        <div class="results-list" id="resultsList"></div>
    </div>

    <!-- Modal for word details -->
    <div class="modal-overlay" id="wordModal">
        <div class="word-card">
            <button class="word-card-close" onclick="closeWordModal()">✕</button>
            <h3 id="wordTitle"></h3>
            <p class="pinyin" id="wordPinyin"></p>
            <p class="meaning" id="wordMeaning"></p>
            <div class="image-container" id="wordImageContainer" style="display: none;">
                <img id="wordImage" alt="Word illustration">
            </div>
        </div>
    </div>

    <script>
        // Sample data - In production, this would be loaded from a JSON file
        const sampleData = [
            {
                "id": 171,
                "title": "The overload of ideas results in an inability to make a choice, and finally results in deciding not to pursue any of them at all.",
                "segments": [
                    "The overload of ideas ",
                    "results in ",
                    "an inability to ",
                    "make a choice, and ",
                    "finally results in ",
                    "deciding not to pursue ",
                    "any of them at all",
                    "."
                ],
                "highlight": [
                    "results in",
                    "an inability to",
                    "any of them at all",
                    "finally results in"
                ],
                "description": "ði ˈoʊvərˌloʊd ʌv aɪˈdiəz rɪˈzʌlts ɪn ən ˌɪnəˈbɪlɪti tu meɪk ə ʧɔɪs, ænd ˈfaɪnəli rɪˈzʌlts ɪn ˌdɪˈsaɪdɪŋ nɑt tu pərˈsu ˈɛni ʌv ðɛm æt ɔl.<br>Sự quá tải ý tưởng dẫn đến việc không thể đưa ra lựa chọn, và cuối cùng dẫn đến việc quyết định không theo đuổi bất kỳ ý tưởng nào cả.",
                "audioSrc": ""
            },
            {
                "id": 172,
                "title": "Opportunity lies in the place where the complaints are.",
                "segments": [
                    "Opportunity ",
                    "lies in ",
                    "the place ",
                    "where ",
                    "the complaints are",
                    "."
                ],
                "highlight": [
                    "lies in",
                    "complaints"
                ],
                "description": "ˌɑpərˈtunəti laɪz ɪn ðə pleɪs wɛr ðə kəmˈpleɪnts ɑr.<br>Cơ hội nằm ở nơi mà những lời phàn nàn xuất hiện.",
                "audioSrc": ""
            },
            {
                "id": 173,
                "title": "Success is not final, failure is not fatal.",
                "segments": [
                    "Success ",
                    "is not ",
                    "final, ",
                    "failure ",
                    "is not ",
                    "fatal",
                    "."
                ],
                "highlight": [
                    "is not",
                    "Success",
                    "failure"
                ],
                "description": "səkˈsɛs ɪz nɑt ˈfaɪnəl, ˈfeɪljər ɪz nɑt ˈfeɪtəl.<br>Thành công không phải là điểm kết thúc, thất bại không phải là tuyệt vọng.",
                "audioSrc": ""
            }
        ];

        let allSentences = [...sampleData];
        let currentResults = [];
        let wordsData = [];

        // Hàm bỏ dấu tiếng Việt để tìm kiếm chính xác hơn
        function removeVietnameseTones(str) {
            return str.normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase();
        }

        // Load data from JSON file (if available)
        async function loadData() {
            try {
                // Try to load from a data.json file
                const response = await fetch('data/passage-sentence.json');
                if (response.ok) {
                    allSentences = await response.json();
                }
                // Load p-words.json
                const wordsResponse = await fetch('data/p-words.json');
                if (wordsResponse.ok) {
                    wordsData = await wordsResponse.json();
                }
            } catch (error) {
                console.log('Using sample data. To use your own data, create a data.json file.');
            }
        }

        function performSearch() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            
            if (!searchTerm) {
                clearSearch();
                return;
            }

            const searchTitle = document.getElementById('searchTitle').checked;
            const searchDescription = document.getElementById('searchDescription').checked;
            const caseSensitive = document.getElementById('caseSensitive').checked;

            // Hỗ trợ tìm kiếm tiếng Việt: chuẩn bị cả version bỏ dấu
            let term = caseSensitive ? searchTerm : searchTerm.toLowerCase();
            let termNoTones = removeVietnameseTones(searchTerm.toLowerCase());

            currentResults = allSentences.filter(sentence => {
                let found = false;

                if (searchTitle) {
                    const titleText = caseSensitive ? sentence.title : sentence.title.toLowerCase();
                    const titleNoTones = removeVietnameseTones(titleText);
                    
                    if (titleText.includes(term) || titleNoTones.includes(termNoTones)) {
                        found = true;
                    }
                }

                if (searchDescription && !found) {
                    const descText = caseSensitive ? sentence.description : sentence.description.toLowerCase();
                    const descNoTones = removeVietnameseTones(descText);
                    
                    if (descText.includes(term) || descNoTones.includes(termNoTones)) {
                        found = true;
                    }
                }

                return found;
            });

            displayResults();
        }

        function displayResults() {
            const resultsList = document.getElementById('resultsList');
            const resultsInfo = document.getElementById('resultsInfo');
            const resultCount = document.getElementById('resultCount');

            if (currentResults.length === 0) {
                resultsList.innerHTML = `
                    <div class="no-results">
                        <h3>No results found</h3>
                        <p>Try adjusting your search terms or filters</p>
                    </div>
                `;
                resultsInfo.style.display = 'none';
                return;
            }

            resultCount.textContent = currentResults.length;
            resultsInfo.style.display = 'flex';

            resultsList.innerHTML = currentResults.map((item, index) => {
                const highlightSet = new Set(
                    (item.highlight || []).map(h => h.trim())
                );

                const segmentsHTML = (item.segments || []).map(segment => {
                    const isHighlighted = highlightSet.has(segment.trim());
                    const className = isHighlighted ? 'highlight' : '';
                    return `<span class="${className}">${escapeHtml(segment)}</span>`;
                }).join('');

                const descriptionHTML = item.description.replace(/\\n/g, '<br>');

                return `
                    <div class="sentence-item">
                        <div class="sentence-id">ID: ${item.id}</div>
                        <div class="sentence-row">
                            <button class="audio-btn" onclick="playAudio('${escapeHtml(item.audioSrc)}', '${escapeHtml(item.title)}')" title="Listen">☊</button>
                            <button class="toggle-description" onclick="toggleDescription(this)" title="Toggle description">⬇️</button>
                        </div>
                        <h2>${segmentsHTML}</h2>
                        <p class="description" style="display: none;">${descriptionHTML}</p>
                    </div>
                `;
            }).join('');

            // Add event listeners for highlights
            document.querySelectorAll('.sentence-item h2 span.highlight').forEach(span => {
                span.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const word = this.textContent.trim();
                    showWordCard(word);
                });
            });
        }

        function showWordCard(word) {
            // Tìm từ trong wordsData
            const wordData = wordsData.find(w => 
                w.character.toLowerCase() === word.toLowerCase()
            );

            if (wordData) {
                document.getElementById('wordTitle').textContent = wordData.character;
                document.getElementById('wordPinyin').textContent = wordData.pinyin || '';
                document.getElementById('wordMeaning').textContent = wordData.meaning || '';
                
                // Hiển thị ảnh nếu có
                const imageContainer = document.getElementById('wordImageContainer');
                if (wordData.imageSrc) {
                    document.getElementById('wordImage').src = wordData.imageSrc;
                    imageContainer.style.display = 'block';
                } else {
                    imageContainer.style.display = 'none';
                }

                document.getElementById('wordModal').classList.add('active');
            }
        }

        function closeWordModal() {
            document.getElementById('wordModal').classList.remove('active');
        }

        // Close modal khi click outside
        document.addEventListener('click', (e) => {
            const modal = document.getElementById('wordModal');
            if (e.target === modal) {
                closeWordModal();
            }
        });

        function toggleDescription(button) {
            const item = button.closest('.sentence-item');
            const description = item.querySelector('.description');
            
            if (description.style.display === 'block') {
                description.style.display = 'none';
                button.textContent = '⬇️';
            } else {
                description.style.display = 'block';
                button.textContent = '⬅️';
            }
        }

        function playAudio(audioSrc, title) {
            if (audioSrc && audioSrc.trim()) {
                const audio = new Audio(audioSrc);
                audio.play().catch(err => {
                    console.error('Error playing audio:', err);
                    alert('Could not play audio file');
                });
            } else {
                // Use Web Speech API for TTS
                const utterance = new SpeechSynthesisUtterance(title);
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('resultsList').innerHTML = '';
            document.getElementById('resultsInfo').style.display = 'none';
            currentResults = [];
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Allow Enter key to search
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        // Load data on page load
        window.addEventListener('load', () => {
            loadData();
        });
    </script>
</body>
</html>
