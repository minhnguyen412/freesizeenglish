<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREESIZE ENGLISH — Study Session</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black:#1a1a1a;--red:#e63030;--red-dark:#b71c1c;--red-light:#ffd5d5;--red-pale:#fff5f5;
    --cream:#fffef5;--white:#ffffff;--yellow:#ffd84d;--yellow-pale:#fffbe6;
    --sky:#72c8f0;--sky-pale:#eaf8ff;--green:#4caf50;--green-pale:#f0fff0;--green-dark:#2e7d32;
    --muted:#888;
    --border:2.5px solid var(--black);--border-thick:3px solid var(--black);
    --shadow-sm:3px 3px 0 var(--black);--shadow-md:4px 4px 0 var(--black);--shadow-lg:6px 6px 0 var(--black);
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Fredoka',sans-serif;font-weight:500;background:var(--cream);color:var(--black);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(0,0,0,.04) 1px,transparent 1px);background-size:22px 22px;pointer-events:none;z-index:0}
  header{background:var(--red);border-bottom:var(--border-thick);padding:0 50px;height:66px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
  .logo{font-weight:700;font-size:1.65rem;color:white;letter-spacing:.05em;text-shadow:2px 2px 0 rgba(0,0,0,.25);text-decoration:none}
  #app{position:relative;z-index:1}
  .hidden{display:none !important}
  .page-grid{display:grid;grid-template-columns:340px 1fr;gap:26px;padding:36px 56px 100px;max-width:1300px;margin:0 auto;align-items:start}
  .video-col{position:sticky;top:88px;display:flex;flex-direction:column;gap:14px}
  .video-card{background:var(--black);border:var(--border-thick);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-lg);aspect-ratio:9/16;display:flex;align-items:center;justify-content:center;width:100%}
  .video-card iframe{width:100%;height:100%;border:none;display:block}
  .video-placeholder{background:var(--white);border:var(--border-thick);border-radius:20px;box-shadow:var(--shadow-md);aspect-ratio:9/16;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-family:'Quicksand',sans-serif;font-weight:600;font-size:.95rem;text-align:center;padding:24px}
  .video-placeholder .big-emoji{font-size:3.5rem}
  .video-link-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--red-light);border:var(--border);border-radius:50px;padding:10px 20px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow-sm);text-decoration:none;color:var(--black);transition:transform .12s,box-shadow .12s;cursor:pointer;font-family:'Fredoka',sans-serif;width:100%}
  .video-link-btn:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow-md)}

  /* TikTok wrapper + audio mode */
  .tt-wrap{display:flex;flex-direction:column;gap:14px}
  .tt-frame{position:relative;border:var(--border-thick);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-lg);aspect-ratio:9/16;background:#111;transition:height .25s}
  .tt-frame iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:none;display:block}
  .audio-mode .tt-frame{aspect-ratio:auto;height:90px}
  .audio-mode .tt-frame iframe{top:auto;bottom:0;height:740px}

  .video-meta-card{background:var(--red);border:var(--border-thick);border-radius:16px;box-shadow:var(--shadow-md);padding:14px 16px;color:white;text-align:center}
  .content-col{display:flex;flex-direction:column;gap:20px}
  .card{background:var(--white);border:var(--border-thick);border-radius:22px;box-shadow:var(--shadow-md);padding:24px;animation:fadeUp .38s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .card-title{display:inline-block;font-weight:700;font-size:.95rem;background:var(--red);color:white;border:var(--border);border-radius:50px;padding:5px 20px;box-shadow:var(--shadow-sm);margin-bottom:16px}
  .card-title.yellow{background:var(--yellow);color:var(--black)}
  .date-pill{font-family:'Quicksand',sans-serif;font-size:.75rem;font-weight:700;background:var(--yellow-pale);border:var(--border);border-radius:50px;padding:3px 12px;box-shadow:var(--shadow-sm);display:inline-block;margin-bottom:16px;margin-left:8px}
  .transcript-body{font-family:'Quicksand',sans-serif;font-size:1rem;font-weight:600;line-height:1.85;color:#333;background:var(--red-pale);border:var(--border);border-radius:14px;padding:16px 18px;max-height:260px;overflow-y:auto;white-space:pre-wrap}
  .transcript-body::-webkit-scrollbar{width:5px}
  .transcript-body::-webkit-scrollbar-thumb{background:var(--red-light);border-radius:3px}

  /* ── MODAL ── */
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:20px}
  .modal.active{display:flex}
  .modal-content{background:var(--white);border:var(--border-thick);border-radius:20px;box-shadow:var(--shadow-lg);padding:28px;max-width:700px;width:100%;max-height:90vh;overflow-y:auto}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px}
  .modal-title{font-weight:700;font-size:1.3rem;background:var(--yellow);border:var(--border);border-radius:50px;padding:8px 24px;box-shadow:var(--shadow-sm)}
  .modal-close{font-size:1.8rem;cursor:pointer;background:none;border:none;color:var(--black);transition:transform .12s}
  .modal-close:hover{transform:scale(1.2)}
  .step-label{font-weight:700;color:var(--muted);font-size:.9rem;margin-bottom:12px}

  /* Feedback banner (replaces alert) */
  .feedback{font-weight:700;font-size:.95rem;border:var(--border);border-radius:12px;padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
  .feedback.ok{background:var(--green-pale);color:var(--green-dark)}
  .feedback.bad{background:var(--red-light);color:var(--red-dark)}
  .feedback.info{background:var(--yellow-pale);color:var(--black)}

  /* STEP 1 */
  .arrange-section{display:none}
  .arrange-section.active{display:block}
  .sentence-preview{font-family:'Quicksand',sans-serif;font-size:1rem;font-weight:600;line-height:1.8;background:var(--red-pale);border:var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .words-container{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;justify-content:flex-start}
  .word-btn{font-family:'Quicksand',sans-serif;font-weight:700;font-size:.95rem;padding:8px 16px;background:var(--white);border:var(--border-thick);border-radius:12px;box-shadow:0 4px 0 var(--black);cursor:pointer;transition:transform .1s,box-shadow .1s;user-select:none;white-space:nowrap}
  .word-btn:hover:not(.used){transform:translateY(-2px);box-shadow:0 6px 0 var(--black);background:var(--yellow-pale)}
  .word-btn.used{opacity:.2;pointer-events:none}
  .blank-space{display:inline-flex;align-items:center;justify-content:center;min-width:50px;height:32px;border:2.5px dashed #999;border-radius:8px;background:transparent;color:#999;margin:2px;padding:0 8px;font-weight:700;font-size:.9rem}
  .blank-space.filled{background:var(--sky-pale);border:var(--border-thick);border-style:solid;color:var(--black);cursor:pointer}
  .blank-space.filled.correct{background:var(--green-pale);color:var(--green-dark)}
  .blank-space.filled.wrong{background:var(--red-light);color:var(--red-dark)}

  /* STEP 2 */
  .record-section{display:none}
  .record-section.active{display:block}
  .sentence-to-read{font-family:'Quicksand',sans-serif;font-size:1.05rem;font-weight:600;line-height:1.8;background:var(--green-pale);border:var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .recorder-box{background:var(--red-pale);border:var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .rec-controls{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .rec-dot{width:12px;height:12px;border-radius:50%;background:var(--muted);border:var(--border);flex-shrink:0}
  .rec-dot.active{background:var(--red);animation:blink 1s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .rec-timer{font-family:'Quicksand',sans-serif;font-weight:700;font-size:1.1rem;min-width:50px}
  .rec-btn{font-family:'Fredoka',sans-serif;font-weight:700;font-size:.95rem;padding:9px 20px;border:var(--border-thick);border-radius:50px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .12s,box-shadow .12s;white-space:nowrap;background:var(--white);color:var(--black)}
  .rec-btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:var(--shadow-md)}
  .rec-btn:disabled{opacity:.4;pointer-events:none}
  .rec-btn.red{background:var(--red);color:white}
  .stt-box{font-family:'Quicksand',sans-serif;font-weight:600;font-size:.9rem;line-height:1.7;color:var(--black);background:var(--white);border:var(--border);border-radius:10px;padding:11px 14px;min-height:52px;white-space:pre-wrap;word-break:break-word}
  .stt-box.placeholder{color:var(--muted)}

  /* Result panel */
  .result-box{border:var(--border);border-radius:14px;padding:14px 16px;margin-bottom:14px;background:var(--white);box-shadow:var(--shadow-sm)}
  .score-line{font-size:1.3rem;font-weight:700;margin-bottom:8px}
  .word-result{font-family:'Quicksand',sans-serif;font-weight:700;font-size:1rem;line-height:2.2}
  .wr-ok{background:var(--green-pale);color:var(--green-dark);border:1.5px solid var(--green-dark);border-radius:6px;padding:1px 6px;margin:2px;display:inline-block}
  .wr-miss{background:var(--red-light);color:var(--red-dark);border:1.5px solid var(--red-dark);border-radius:6px;padding:1px 6px;margin:2px;display:inline-block}
  .said{margin-top:10px;font-family:'Quicksand',sans-serif;font-weight:600;color:#555;font-size:.9rem}

  /* Done */
  .done-section{text-align:center;padding:20px 0}
  .done-section.active{display:block}
  .done-section{display:none}
  .done-emoji{font-size:3.5rem;margin-bottom:10px}
  .done-section h3{font-size:1.4rem;margin-bottom:8px}
  .done-section p{font-family:'Quicksand',sans-serif;font-weight:600;color:#555}

  .modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;justify-content:flex-end}
  .modal-actions button{font-family:'Fredoka',sans-serif;font-weight:700;font-size:.95rem;padding:10px 26px;border:var(--border-thick);border-radius:50px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .12s,box-shadow .12s}
  .modal-actions button:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:var(--shadow-md)}
  .modal-actions button:disabled{opacity:.4;pointer-events:none}
  .btn-green{background:var(--green);color:white}
  .btn-yellow{background:var(--yellow);color:var(--black)}
  .btn-black{background:var(--black);color:white}

  footer{background:var(--black);color:rgba(255,255,255,.6);padding:28px 50px;text-align:center;position:relative;z-index:1}
  footer .brand{font-weight:700;color:var(--red-light);font-size:1.2rem;margin-bottom:4px}
  footer p{font-size:.9rem}
  @media(max-width:900px){.page-grid{grid-template-columns:1fr;padding:20px 20px 80px}.video-col{position:static}.video-card,.video-placeholder,.tt-wrap{max-width:320px;margin:0 auto;width:100%}}
  @media(max-width:600px){header{padding:0 16px}.video-card,.video-placeholder{max-width:100%}.card{padding:16px}.page-grid{padding:14px 14px 60px;gap:16px}.modal-content{padding:16px}}
</style>
</head>
<body>
<header><a class="logo" href="index.html">🔴 FREESIZE ENGLISH</a></header>
<div id="app"></div>
<footer><p class="brand">FREESIZE ENGLISH</p><p>Your personal English study archive</p></footer>

<!-- QUIZ MODAL -->
<div class="modal" id="quizModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">🎯 Practice Quiz</div>
      <button class="modal-close" onclick="closeQuizModal()">✕</button>
    </div>

    <!-- STEP 1: ARRANGE -->
    <div class="arrange-section" id="arrangeSection">
      <div class="step-label" id="arrangeLabel">STEP 1</div>
      <div class="sentence-preview" id="sentencePreview"></div>
      <div class="words-container" id="wordsContainer"></div>
      <div class="feedback hidden" id="arrangeFeedback"></div>
      <div class="modal-actions">
        <button class="btn-green" id="checkArrangeBtn" disabled>✓ Check Answer</button>
        <button class="btn-black" onclick="closeQuizModal()">✕ Close</button>
      </div>
    </div>

    <!-- STEP 2: RECORD -->
    <div class="record-section" id="recordSection">
      <div class="step-label" id="recordLabel">STEP 2</div>
      <div class="sentence-to-read" id="sentenceToRead"></div>
      <div class="recorder-box">
        <div class="rec-controls">
          <div class="rec-dot" id="recDot"></div>
          <div class="rec-timer" id="recTimer">00:00</div>
          <button class="rec-btn red" id="recStartBtn">● REC</button>
          <button class="rec-btn" id="recStopBtn" disabled>■ Stop</button>
        </div>
        <div class="stt-box placeholder" id="sttOutput">Speech-to-text appears here...</div>
      </div>
      <div class="feedback hidden" id="recordFeedback"></div>
      <div class="result-box hidden" id="resultBox"></div>
      <div class="modal-actions">
        <button class="btn-green" id="nextQuizBtn" disabled>→ Next Question</button>
        <button class="btn-black" onclick="closeQuizModal()">✕ Close</button>
      </div>
    </div>

    <!-- DONE -->
    <div class="done-section" id="doneSection">
      <div class="done-emoji">🎉</div>
      <h3>Congratulations!</h3>
      <p id="doneText"></p>
      <div class="modal-actions" style="justify-content:center">
        <button class="btn-black" onclick="closeQuizModal()">✕ Close</button>
      </div>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════════════════════
function getParam(k){return new URLSearchParams(window.location.search).get(k)}
function fmtDate(iso){if(!iso)return'—';try{return new Date(iso).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return iso}}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function setFeedback(el, type, msg){
  if(!msg){ el.className='feedback hidden'; el.textContent=''; return; }
  el.className='feedback '+type;
  el.textContent=msg;
}

// ════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════
let quizOpen = false;
let currentLesson = null;
let currentQuizzes = [];
let currentQuizIndex = 0;
let arrangementSlots = [];
let advanceTimer = null;

let mediaRecorder = null;
let isRecording = false;
let recSecs = 0;
let timerInterval = null;

let speechRec = null;
let sttFinal = '';
let sttInterim = '';
let evalPending = false;
let sttFallback = null;
let resultReady = false;

// ════════════════════════════════════════════════════════════════
// OPEN / CLOSE
// ════════════════════════════════════════════════════════════════
async function openQuizModal() {
  const id = getParam('id');
  if (!id) { alert('No session ID found'); return; }

  try {
    const res = await fetch('data/speaking-data-1.json');
    if (!res.ok) throw new Error('Cannot load quiz data');
    const data = await res.json();
    const allLessons = Array.isArray(data) ? data : Object.values(data);

    const lesson = allLessons.find(l => String(l.id) === String(id));
    if (!lesson) throw new Error('Lesson not found');

    currentLesson = lesson;
    currentQuizzes = lesson.quizzes || [];
    currentQuizIndex = 0;

    if (currentQuizzes.length === 0) { alert('No quizzes found in this lesson'); return; }

    quizOpen = true;
    document.getElementById('quizModal').classList.add('active');
    showArrangeStep();
  } catch(err) {
    alert('Error loading quiz: ' + err.message);
  }
}

function closeQuizModal() {
  quizOpen = false;
  clearTimeout(advanceTimer);
  if (isRecording) stopRecording();
  cleanupSTT();
  document.getElementById('quizModal').classList.remove('active');
  currentLesson = null;
  currentQuizzes = [];
  currentQuizIndex = 0;
}

function showOnly(sectionId) {
  ['arrangeSection','recordSection','doneSection'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.toggle('active', id === sectionId);
  });
  // doneSection uses display via .active; arrange/record use .active too
}

// ════════════════════════════════════════════════════════════════
// STEP 1: ARRANGE
// ════════════════════════════════════════════════════════════════
function showArrangeStep() {
  if (!currentQuizzes || currentQuizIndex >= currentQuizzes.length) return;
  const currentQuiz = currentQuizzes[currentQuizIndex];

  showOnly('arrangeSection');
  document.getElementById('arrangeLabel').textContent =
    `STEP 1: Arrange words (Question ${currentQuizIndex + 1}/${currentQuizzes.length})`;

  const sentence = currentQuiz.sentence || '';
  const blanks = currentQuiz.blanks || [];
  const words = (currentQuiz.words || []).slice().sort(() => Math.random() - 0.5);

  let blankIndex = 0;
  const sentenceHTML = sentence.replace(/___/g, () =>
    `<span class="blank-space" data-blank-index="${blankIndex++}"></span>`);
  document.getElementById('sentencePreview').innerHTML = sentenceHTML;

  const wordsContainer = document.getElementById('wordsContainer');
  wordsContainer.innerHTML = '';
  words.forEach((word, idx) => {
    const btn = document.createElement('button');
    btn.className = 'word-btn';
    btn.textContent = word;
    btn.dataset.idx = idx;
    btn.onclick = () => selectWord(btn, word);
    wordsContainer.appendChild(btn);
  });

  arrangementSlots = new Array(blanks.length).fill(null);
  setFeedback(document.getElementById('arrangeFeedback'), '', '');
  updateCheckBtn();
}

function getBlankEl(i) {
  return document.querySelector(`#sentencePreview [data-blank-index="${i}"]`);
}

function updateCheckBtn() {
  const btn = document.getElementById('checkArrangeBtn');
  btn.disabled = arrangementSlots.length === 0 || arrangementSlots.some(s => s === null);
}

function selectWord(btn, word) {
  if (btn.classList.contains('used')) return;
  const emptyIdx = arrangementSlots.findIndex(s => s === null);
  if (emptyIdx === -1) return;

  const blankEl = getBlankEl(emptyIdx);
  if (!blankEl) return;

  btn.classList.add('used');
  blankEl.textContent = word;
  blankEl.className = 'blank-space filled';
  blankEl.dataset.word = word;
  blankEl.onclick = () => removeWord(blankEl, btn, emptyIdx);

  arrangementSlots[emptyIdx] = { btn, word };
  setFeedback(document.getElementById('arrangeFeedback'), '', '');
  updateCheckBtn();
}

function removeWord(blankEl, btn, idx) {
  btn.classList.remove('used');
  blankEl.textContent = '';
  blankEl.className = 'blank-space';
  blankEl.removeAttribute('data-word');
  blankEl.onclick = null;
  arrangementSlots[idx] = null;
  setFeedback(document.getElementById('arrangeFeedback'), '', '');
  updateCheckBtn();
}

function checkArrange() {
  if (!currentQuizzes || currentQuizIndex >= currentQuizzes.length) return;
  if (arrangementSlots.some(s => s === null)) return;

  const blanks = currentQuizzes[currentQuizIndex].blanks || [];
  let allCorrect = true;

  arrangementSlots.forEach((slot, i) => {
    const ok = String(slot.word) === String(blanks[i].answer);
    if (!ok) allCorrect = false;
    const el = getBlankEl(i);
    if (el) el.className = 'blank-space filled ' + (ok ? 'correct' : 'wrong');
  });

  const fb = document.getElementById('arrangeFeedback');
  if (allCorrect) {
    setFeedback(fb, 'ok', '✅ Correct! Now record your pronunciation.');
    document.getElementById('checkArrangeBtn').disabled = true;
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(() => { if (quizOpen) showRecordStep(); }, 1000);
  } else {
    setFeedback(fb, 'bad', '❌ Some words are in the wrong place. Tap a word to remove it and try again.');
  }
}

// ════════════════════════════════════════════════════════════════
// STEP 2: RECORD
// ════════════════════════════════════════════════════════════════
function showRecordStep() {
  if (!currentQuizzes || currentQuizIndex >= currentQuizzes.length) return;
  const currentQuiz = currentQuizzes[currentQuizIndex];

  showOnly('recordSection');
  document.getElementById('recordLabel').textContent =
    `STEP 2: Record your pronunciation (Question ${currentQuizIndex + 1}/${currentQuizzes.length})`;
  document.getElementById('sentenceToRead').textContent = getEnglishSentence(currentQuiz);

  resetRecorder();
}

function resetRecorder() {
  if (isRecording) stopRecording();
  cleanupSTT();
  recSecs = 0;
  sttFinal = '';
  sttInterim = '';
  resultReady = false;

  document.getElementById('recTimer').textContent = '00:00';
  renderSTT();
  document.getElementById('recDot').classList.remove('active');
  document.getElementById('recStartBtn').disabled = false;
  document.getElementById('recStopBtn').disabled = true;
  document.getElementById('nextQuizBtn').disabled = true;
  document.getElementById('resultBox').classList.add('hidden');
  setFeedback(document.getElementById('recordFeedback'), '', '');
}

function renderSTT() {
  const out = document.getElementById('sttOutput');
  const txt = (sttFinal + sttInterim).trim();
  if (txt) {
    out.textContent = txt;
    out.classList.remove('placeholder');
  } else {
    out.textContent = isRecording ? '...listening' : 'Speech-to-text appears here...';
    out.classList.add('placeholder');
  }
}

async function startRecording() {
  if (isRecording) return;
  setFeedback(document.getElementById('recordFeedback'), '', '');
  document.getElementById('resultBox').classList.add('hidden');
  document.getElementById('nextQuizBtn').disabled = true;
  resultReady = false;
  sttFinal = '';
  sttInterim = '';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mimeType = getSupportedMimeType();
    mediaRecorder = mimeType
      ? new MediaRecorder(stream, { mimeType })
      : new MediaRecorder(stream);
    mediaRecorder.start();

    isRecording = true;
    document.getElementById('recDot').classList.add('active');
    document.getElementById('recStartBtn').disabled = true;
    document.getElementById('recStopBtn').disabled = false;

    recSecs = 0;
    document.getElementById('recTimer').textContent = '00:00';
    timerInterval = setInterval(() => {
      recSecs++;
      const m = String(Math.floor(recSecs / 60)).padStart(2, '0');
      const s = String(recSecs % 60).padStart(2, '0');
      document.getElementById('recTimer').textContent = `${m}:${s}`;
    }, 1000);

    startSTT();
    renderSTT();
  } catch(err) {
    setFeedback(document.getElementById('recordFeedback'), 'bad', '❌ Microphone error: ' + err.message);
  }
}

function stopRecording() {
  if (!isRecording) return;
  isRecording = false;
  clearInterval(timerInterval);

  try {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  } catch {}
  if (mediaRecorder && mediaRecorder.stream) {
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
  }
  mediaRecorder = null;

  document.getElementById('recDot').classList.remove('active');
  document.getElementById('recStartBtn').disabled = false;
  document.getElementById('recStopBtn').disabled = true;

  // Wait for the final speech-to-text result, then grade
  if (speechRec) {
    evalPending = true;
    clearTimeout(sttFallback);
    sttFallback = setTimeout(finishSTT, 1500); // safety net if onend never fires
    try { speechRec.stop(); } catch { finishSTT(); }
  } else {
    evalPending = true;
    finishSTT();
  }
}

function getSupportedMimeType() {
  const types = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/ogg'];
  for (const t of types) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';
}

// ── Speech-to-text ──
function startSTT() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    speechRec = null;
    return;
  }

  speechRec = new SR();
  speechRec.continuous = true;
  speechRec.interimResults = true;
  speechRec.lang = 'en-US';

  speechRec.onresult = (e) => {
    sttInterim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) sttFinal += t + ' ';
      else sttInterim += t;
    }
    renderSTT();
  };

  speechRec.onerror = (e) => {
    if (e.error !== 'no-speech' && e.error !== 'aborted') {
      const out = document.getElementById('sttOutput');
      out.textContent = 'STT error: ' + e.error;
      out.classList.remove('placeholder');
    }
  };

  speechRec.onend = () => {
    if (evalPending) { finishSTT(); return; }
    // Browser ended recognition on its own while still recording: restart it
    if (isRecording && speechRec) { try { speechRec.start(); } catch {} }
  };

  try { speechRec.start(); } catch {}
}

function cleanupSTT() {
  evalPending = false;
  clearTimeout(sttFallback);
  if (speechRec) {
    speechRec.onend = null;
    speechRec.onresult = null;
    speechRec.onerror = null;
    try { speechRec.abort(); } catch {}
    speechRec = null;
  }
}

function finishSTT() {
  if (!evalPending) return;
  evalPending = false;
  clearTimeout(sttFallback);
  speechRec = null;
  renderSTT();
  showResult();
}
// Ghép câu tiếng Anh hoàn chỉnh từ các đáp án (answer chips)
function getEnglishSentence(quiz) {
  const blanks = quiz.blanks || [];
  let i = 0;
  return (quiz.sentence || '').replace(/___/g, () => {
    const ans = blanks[i++];
    return ans ? ans.answer : '___';
  });
}
// ── Grading ──
function normWord(w) {
  return String(w).toLowerCase().replace(/’/g, "'").replace(/[^a-z0-9']/g, '');
}

// Returns boolean array: which target tokens appear in the spoken sequence (in order, LCS)
function lcsMatch(targetNorms, spokenNorms) {
  const n = targetNorms.length, m = spokenNorms.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = 1; i <= n; i++) {
    for (let j = 1; j <= m; j++) {
      dp[i][j] = targetNorms[i - 1] === spokenNorms[j - 1]
        ? dp[i - 1][j - 1] + 1
        : Math.max(dp[i - 1][j], dp[i][j - 1]);
    }
  }
  const matched = new Array(n).fill(false);
  let i = n, j = m;
  while (i > 0 && j > 0) {
    if (targetNorms[i - 1] === spokenNorms[j - 1]) {
      matched[i - 1] = true; i--; j--;
    } else if (dp[i - 1][j] >= dp[i][j - 1]) {
      i--;
    } else {
      j--;
    }
  }
  return matched;
}

function showResult() {
  if (!quizOpen) return;
  const quiz = currentQuizzes[currentQuizIndex];
  if (!quiz) return;

  const resultBox = document.getElementById('resultBox');
  const fb = document.getElementById('recordFeedback');
  const nextBtn = document.getElementById('nextQuizBtn');
  const sttSupported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);

  // Browser without speech recognition: allow moving on, nothing to grade
  if (!sttSupported) {
    resultBox.classList.add('hidden');
    setFeedback(fb, 'info', 'Speech recognition is not supported in this browser (use Chrome/Edge). You can continue.');
    resultReady = true;
    nextBtn.disabled = false;
    return;
  }

  const origTokens = getEnglishSentence(quiz).split(/\s+/).filter(Boolean);
  const targetItems = origTokens
    .map(t => ({ text: t, norm: normWord(t) }))
    .filter(x => x.norm !== '');
  const spokenRaw = (sttFinal + sttInterim).trim();
  const spokenNorms = spokenRaw.split(/\s+/).map(normWord).filter(Boolean);

  if (spokenNorms.length === 0) {
    resultBox.innerHTML = `
      <div class="score-line">❌ No speech detected</div>
      <div class="said">Tap REC, read the sentence aloud, then press Stop.</div>`;
    resultBox.classList.remove('hidden');
    setFeedback(fb, 'bad', 'Please record again.');
    resultReady = false;
    nextBtn.disabled = true;
    return;
  }

  const matched = lcsMatch(targetItems.map(x => x.norm), spokenNorms);
  const hits = matched.filter(Boolean).length;
  const score = Math.round((hits / targetItems.length) * 100);
  const pass = score >= 80;

  const wordsHTML = targetItems.map((x, i) =>
    `<span class="${matched[i] ? 'wr-ok' : 'wr-miss'}">${esc(x.text)}</span>`).join(' ');

  resultBox.innerHTML = `
    <div class="score-line">${pass ? '✅' : '⚠️'} Score: ${score}%</div>
    <div class="word-result">${wordsHTML}</div>
    <div class="said">You said: "${esc(spokenRaw)}"</div>`;
  resultBox.classList.remove('hidden');

  if (pass) setFeedback(fb, 'ok', '🎉 Great pronunciation! Press Next to continue.');
  else setFeedback(fb, 'bad', 'Keep practicing. You can record again or press Next.');

  resultReady = true;
  nextBtn.disabled = false;
}

// ── Next ──
function nextQuiz() {
  if (!resultReady) return;
  stopRecording();
  cleanupSTT();

  currentQuizIndex++;
  if (currentQuizIndex >= currentQuizzes.length) {
    showOnly('doneSection');
    document.getElementById('doneText').textContent =
      `You completed all ${currentQuizzes.length} quizzes in this lesson!`;
  } else {
    showArrangeStep();
  }
}

// ════════════════════════════════════════════════════════════════
// RENDER PAGE
// ════════════════════════════════════════════════════════════════
function renderPage(raw) {
  const d = raw;
  document.title = `${d.id||'Session'} — Freesize English`;

  const videoColHTML = buildVideoColHTML(buildVideo(d.videoUrl));
  const transcriptHTML = d.transcript && d.transcript.trim()
    ? `<div class="transcript-body">${esc(d.transcript)}</div>`
    : `<div style="text-align:center;color:var(--muted);padding:20px;font-family:'Quicksand',sans-serif;">No transcript saved.</div>`;

  document.getElementById('app').innerHTML = `
    <div class="page-grid">
      <div class="video-col">${videoColHTML}</div>
      <div class="content-col">
        <div class="card" style="animation-delay:0s">
          <div class="card-title">📝 Transcript</div>
          <span class="date-pill">📅 ${fmtDate(d.createdAt)}</span>
          ${transcriptHTML}
        </div>

        <div class="card" style="animation-delay:.07s">
          <div class="card-title yellow">🎯 Practice Quiz</div>
          <button id="openQuizBtn" style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:1rem;padding:12px 28px;border:var(--border-thick);border-radius:50px;background:var(--green);color:white;box-shadow:var(--shadow-md);cursor:pointer;transition:transform .12s,box-shadow .12s" onclick="openQuizModal()">▶ Start Quiz</button>
        </div>
      </div>
    </div>`;
}

function buildVideo(url) {
  if (!url || !url.trim()) return null;
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?]+)/);
  if (yt) return { type: 'youtube', iframe: `https://www.youtube.com/embed/${yt[1]}?rel=0`, link: url, label: '↗ Open on YouTube' };
  if (url.includes('tiktok.com')) return { type: 'tiktok', vid: extractTikTokId(url), link: url };
  return { type: 'generic', iframe: url, link: url, label: '↗ Open link' };
}

function extractTikTokId(url) {
  const m = url.match(/\/video\/(\d+)/);
  return m ? m[1] : null;
}

function toggleAudioMode() {
  const wrap = document.getElementById('videoWrap');
  const btn = document.getElementById('audioToggle');
  const on = wrap.classList.toggle('audio-mode');
  btn.textContent = on ? '🎬 Show video' : '🎧 Audio only';
}

function buildVideoColHTML(vid) {
  if (!vid) return `<div class="video-placeholder"><span class="big-emoji">🎬</span><span>No video URL</span></div>`;
  if (vid.type === 'youtube') return `<div class="video-card"><iframe src="${esc(vid.iframe)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div><a class="video-link-btn" href="${esc(vid.link)}" target="_blank" rel="noopener">${esc(vid.label)}</a>`;
  if (vid.type === 'tiktok') {
    if (!vid.vid) return `<div class="video-placeholder"><span class="big-emoji">🎵</span><span>Can't extract TikTok ID</span></div>`;
    return `
      <div class="tt-wrap" id="videoWrap">
        <div class="tt-frame">
          <iframe src="https://www.tiktok.com/embed/v2/${esc(vid.vid)}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen loading="lazy" scrolling="no"></iframe>
        </div>
        <button class="video-link-btn" id="audioToggle" type="button" onclick="toggleAudioMode()">🎧 Audio only</button>
        <a class="video-link-btn" href="${esc(vid.link)}" target="_blank" rel="noopener">↗ Watch on TikTok</a>
      </div>`;
  }
  return `<div class="video-card"><iframe src="${esc(vid.iframe)}" allowfullscreen loading="lazy"></iframe></div><a class="video-link-btn" href="${esc(vid.link)}" target="_blank" rel="noopener">${esc(vid.label)}</a>`;
}

// ════════════════════════════════════════════════════════════════
// BUTTON WIRING
// ════════════════════════════════════════════════════════════════
document.getElementById('checkArrangeBtn').addEventListener('click', checkArrange);
document.getElementById('recStartBtn').addEventListener('click', startRecording);
document.getElementById('recStopBtn').addEventListener('click', stopRecording);
document.getElementById('nextQuizBtn').addEventListener('click', nextQuiz);

// ════════════════════════════════════════════════════════════════
// MAIN
// ════════════════════════════════════════════════════════════════
async function main() {
  const id = getParam('id');
  if (!id) {
    document.getElementById('app').innerHTML = '<div style="padding:40px;text-align:center;color:#999;font-family:Quicksand">No session ID provided</div>';
    return;
  }

  try {
    const res = await fetch('data/speaking-data-1.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    const sessions = Array.isArray(json) ? json : Object.values(json);

    const session = sessions.find(s => String(s.id) === String(id));
    if (!session) throw new Error(`Session "${id}" not found`);

    renderPage(session);
  } catch(err) {
    document.getElementById('app').innerHTML = `<div style="padding:40px;text-align:center"><div style="font-size:2rem;margin-bottom:16px">😕</div><h2>Error</h2><p>${esc(err.message)}</p><p style="font-size:.9rem;color:#999;margin-top:10px">Make sure <code>data/speaking-data-1.json</code> exists.</p></div>`;
  }
}

main();
</script>
